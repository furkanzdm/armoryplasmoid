name: Build Armoury Plasmoid

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y \
          extra-cmake-modules \
          qt6-base-dev \
          qt6-declarative-dev \
          libplasma-dev \
          libkf6i18n-dev \
          build-essential \
          cmake \
          file \
          rpm

    - name: Configure CMake
      # Using relative paths ('.') avoids absolute path mapping bugs in OCI containers
      run: cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Package with CPack
      # Use 'cd' instead of 'working-directory' to safely navigate inside the container
      run: |
        cd build
        cpack -G DEB
        cpack -G RPM

    - name: Upload Debian Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: armoryplasmoid-deb
        path: build/*.deb
