name: Build Armoury Plasmoid

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          extra-cmake-modules \
          qt6-base-dev \
          qt6-declarative-dev \
          libplasma-dev \
          libkf6i18n-dev \
          build-essential

    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

    - name: Package with CPack
      working-directory: ${{ github.workspace }}/build
      run: cpack -G DEB

    - name: Upload Debian Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: asus-armoury-plasmoid-deb
        path: ${{ github.workspace }}/build/*.deb
